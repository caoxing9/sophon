[package]
name = "sophon-relay"
version = "0.1.0"
edition = "2024"
publish = false
description = "A relay for Sophon: forwards end-to-end encrypted sessions between a computer and its phones"

# Built on its own (a server binary), apart from the app.
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
rand = "0.9"
log = "0.4"
env_logger = "0.11"
crypto_box = { version = "0.9", features = ["std"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }

[profile.release]
lto = true
strip = true
