[package]
name = "sophon-service"
version = "0.2.88"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
cap-std = "4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
croner = "3"
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "process", "fs"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
sophon-push = { path = "../sophon-push" }

# The push gateway is reached over TLS when the relay is (`push`): the
# system's.
[target.'cfg(target_os = "macos")'.dependencies]
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
