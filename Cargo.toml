[package]
name = "sophon"
version = "0.2.92"
edition = "2024"
publish = false

[workspace]
members = ["crates/sophon-service", "crates/sophon-push", "crates/nsh-shadcn"]
# Its gallery is an app of its own.
exclude = ["crates/nsh-shadcn/examples"]

[dependencies]
# nsh: longbridge's own, at a commit of its main: the fixes Sophon needs
# are merged there and not yet in a release on crates.io (0.7.1 came
# before them). With the next release these become its versions.
# Git, not versions under `[patch]`: the nsh CLI takes the nsh an app builds
# with from what its manifest declares.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205" }
# Dictation (`speech`), nsh's own module for it.
nsh-extra = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205", default-features = false, features = ["speech"] }
log = "0.4"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
snow = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
crypto_box = { version = "0.9", features = ["std"] }
# Push notifications' shared part (`docs/push.md`).
sophon-push = { path = "crates/sophon-push" }
# shadcn/ui for NSH: Sophon's components, kept here while they change
# with Sophon (`crates/nsh-shadcn`, mirrored to caoxing9/nsh-shadcn: a
# change merged here opens a pull request there, sync-nsh-shadcn.yml).
nsh-shadcn = { path = "crates/nsh-shadcn" }

# Natively the connection runs on a thread of its own with tokio; in a
# browser on the page's WebSocket (`daemon::rt`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nsh-updater = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "fs"] }
tokio-tungstenite = "0.28"
# Peer to peer to a paired computer (QUIC, hole punching, relayed when it
# cannot be direct): tried before the relay.
iroh = "1.5"
if-addrs = "0.13"
# Local days for the usage page's sums (already in the tree through nsh-base).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
iana-time-zone = "0.1.65"

# TLS is the system's, except on Android, which has none to link: there it
# is the rustls NSH already builds tokio-tungstenite with.
# Tests of peer to peer through a relay of one's own: iroh's test relay,
# whose certificate the test endpoints are told not to check.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
iroh = { version = "1.5", features = ["test-utils"] }
iroh-relay = { version = "1.5", features = ["test-utils"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType", "Window", "Storage"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3" }
uuid = { version = "1", features = ["v4", "rng-getrandom"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205", default-features = false }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSObject"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "UIView", "UIResponder"] }
# The network path monitor's handler (`platform::network`; already in the tree through nsh-platform-ios).
block2 = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205", default-features = false }
# The pasteboard's image, for a copied file the app may not read (already in the tree through nsh-platform-macos).
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSEvent", "NSResponder", "NSWindow", "NSView", "block2", "objc2-core-foundation"] }
# The Fn key's monitor (`platform::fn_key`; already in the tree through nsh-platform-macos).
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205", default-features = false }

# nsh-shadcn asks for nsh as published (it is a library of its own, and
# its tests for nsh-engine and nsh-testing); here it builds with the nsh
# above (the same versions, from longbridge's main), so all share one core.
[patch.crates-io]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205" }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205" }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "311fb08dee34ef6a110efa5f3062475169c75205" }
