[package]
name = "sophon"
version = "0.2.14"
edition = "2024"
publish = false

[workspace]
members = ["crates/nsh-ui"]

[dependencies]
nsh-core = { git = "https://github.com/caoxing9/nsh", rev = "51056da5b19d5ce868b0b7f6c9459e4578b8ebc7" }
nsh-base = { git = "https://github.com/caoxing9/nsh", rev = "51056da5b19d5ce868b0b7f6c9459e4578b8ebc7" }
log = "0.4"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
snow = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
crypto_box = { version = "0.9", features = ["std"] }
# Sophon's shadcn-style components (`crates/nsh-ui`).
nsh-ui = { path = "crates/nsh-ui" }

# Natively the connection runs on a thread of its own with tokio; in a
# browser on the page's WebSocket (`daemon::rt`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nsh-updater = { git = "https://github.com/caoxing9/nsh", rev = "51056da5b19d5ce868b0b7f6c9459e4578b8ebc7" }
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "fs"] }
tokio-tungstenite = "0.28"
if-addrs = "0.13"
# Local days for the usage page's sums (already in the tree through nsh-base).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
iana-time-zone = "0.1.65"

# TLS is the system's, except on Android, which has none to link: there it
# is the rustls NSH already builds tokio-tungstenite with.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType", "Window", "Storage"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3" }
uuid = { version = "1", features = ["v4", "rng-getrandom"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { git = "https://github.com/caoxing9/nsh", rev = "51056da5b19d5ce868b0b7f6c9459e4578b8ebc7", default-features = false }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSObject"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "UIView", "UIResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/caoxing9/nsh", rev = "51056da5b19d5ce868b0b7f6c9459e4578b8ebc7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/caoxing9/nsh", rev = "51056da5b19d5ce868b0b7f6c9459e4578b8ebc7", default-features = false }
# The pasteboard's image, for a copied file the app may not read (already in the tree through nsh-platform-macos).
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSEvent", "NSResponder", "block2"] }
# The Fn key's monitor (`platform::fn_key`; already in the tree through nsh-platform-macos).
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/caoxing9/nsh", rev = "51056da5b19d5ce868b0b7f6c9459e4578b8ebc7", default-features = false }
