[package]
name = "sophon"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/caoxing9/nsh", rev = "3921ccc2cf9f6475a20ba7cd1d36e655457ab5e3" }
nsh-base = { git = "https://github.com/caoxing9/nsh", rev = "3921ccc2cf9f6475a20ba7cd1d36e655457ab5e3" }
log = "0.4"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
snow = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
crypto_box = { version = "0.9", features = ["std"] }

# Natively the connection runs on a thread of its own with tokio; in a
# browser on the page's WebSocket (`daemon::rt`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nsh-updater = { git = "https://github.com/caoxing9/nsh", rev = "3921ccc2cf9f6475a20ba7cd1d36e655457ab5e3" }
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "fs"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
if-addrs = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType", "Window", "Storage"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3" }
uuid = { version = "1", features = ["v4", "rng-getrandom"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { git = "https://github.com/caoxing9/nsh", rev = "3921ccc2cf9f6475a20ba7cd1d36e655457ab5e3", default-features = false }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSObject"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "UIView", "UIResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/caoxing9/nsh", rev = "3921ccc2cf9f6475a20ba7cd1d36e655457ab5e3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/caoxing9/nsh", rev = "3921ccc2cf9f6475a20ba7cd1d36e655457ab5e3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/caoxing9/nsh", rev = "3921ccc2cf9f6475a20ba7cd1d36e655457ab5e3", default-features = false }
