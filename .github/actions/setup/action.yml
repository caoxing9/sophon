name: Set up Sophon's build
description: Rust, the cached nsh CLI of the pinned NSH revision, and a Cargo cache of the job's own.
inputs:
  rev:
    description: The NSH revision (the nsh job's output), keying the CLI's cache.
    required: true
  cache-key:
    description: Keeps each job's Cargo cache apart (they build different things).
    required: true
  targets:
    description: Extra Rust targets.
    required: false
    default: ""
  keep-target:
    description: >-
      "true" for a job that packages: keeps the whole target directory. A package builds a second workspace
      (nsh's runner, `.nsh/rust`) into it, which rust-cache does not know and deletes from what it saves, so
      the runner was built from nothing each time (5.5 of a 6 minute job).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: The newest Xcode (the newest SDKs)
      shell: bash
      run: |
        X=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)
        sudo xcode-select -s "$X"
        xcodebuild -version
    - name: Temporary files
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/nsh-tmp"
        echo "TMPDIR=$RUNNER_TEMP/nsh-tmp" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin${{ inputs.targets != '' && format(', {0}', inputs.targets) || '' }}
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/sophon-nsh
        key: nsh-cli-${{ runner.os }}-${{ inputs.rev }}
        fail-on-cache-miss: true
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        # With the target directory kept whole below, only Cargo's registry and git checkouts here.
        cache-targets: ${{ inputs.keep-target != 'true' }}
    - name: The month (the kept target directory starts over with each)
      if: inputs.keep-target == 'true'
      id: month
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    # Saved once per Cargo.lock; a run with another starts from the newest of the month and NSH pin.
    - uses: actions/cache@v4
      if: inputs.keep-target == 'true'
      with:
        path: target
        key: target-${{ inputs.cache-key }}-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ inputs.rev }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          target-${{ inputs.cache-key }}-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ inputs.rev }}-
    - name: nsh on PATH
      shell: bash
      run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
