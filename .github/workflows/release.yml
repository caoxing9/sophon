# Builds Sophon for macOS (Apple silicon), Android (an APK) and, with the
# signing secrets, iOS, publishes a GitHub Release with the update manifest the app checks
# (`latest.json`), updates the Homebrew cask, and, when the App Store
# secrets are set, uploads the iOS build to TestFlight.
#
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no v)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26   # Apple silicon (Intel Macs are not built)
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode (the newest SDKs)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          cache-targets: false
      - name: NSH revision
        id: nshrev
        run: |
          echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The whole target directory, under the key CI's "Package macOS" saves
      # on main: nsh's runner builds into it from a workspace rust-cache does
      # not know, and was built from nothing each time.
      - name: The target directory
        uses: actions/cache@v4
        with:
          path: target
          key: target-macos-${{ runner.os }}-${{ steps.nshrev.outputs.month }}-${{ steps.nshrev.outputs.rev }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-macos-${{ runner.os }}-${{ steps.nshrev.outputs.month }}-${{ steps.nshrev.outputs.rev }}-
      # CI's key: its nsh job builds the CLI once per NSH pin on main, and
      # a release reads that instead of building it again (15 to 25 minutes
      # of each job, when the key was this workflow's own and a tag's run
      # could not read another tag's cache).
      - name: The nsh CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-cli-${{ runner.os }}-${{ steps.nshrev.outputs.rev }}
      - name: The nsh CLI (the commit Cargo.toml pins)
        run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
      - name: Version
        run: scripts/set-version.sh "${{ inputs.version || github.ref_name }}"
      - name: Package
        run: nsh package --target macos
      # Developer ID signing and notarization: set MACOS_CERT_P12 (base64
      # .p12 of a Developer ID Application certificate), MACOS_CERT_PASSWORD
      # and the App Store Connect key (ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8).
      # Without them the app stays ad hoc signed, as before.
      - name: Sign and notarize
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KC="$RUNNER_TEMP/mac.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/mac.p12"
          security import "$RUNNER_TEMP/mac.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n1)
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }

          APP=.nsh/out/Sophon.app
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Sophon.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Sophon.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$APP"

          # The archive nsh wrote holds the ad hoc signed app: write it again.
          V=$(scripts/version.sh)
          COPYFILE_DISABLE=1 tar -czf ".nsh/out/Sophon-$V-macos-${{ matrix.arch }}.tar.gz" -C .nsh/out Sophon.app
      - name: Disk image
        run: |
          V=$(scripts/version.sh)
          mkdir -p dmg && cp -R .nsh/out/Sophon.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Sophon -srcfolder dmg -ov -format UDZO ".nsh/out/Sophon-$V-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            .nsh/out/*.tar.gz
            .nsh/out/*.dmg

  ios:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12 != '' && secrets.IOS_PROFILE != '' }}
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      # Without the signing secrets there is nothing to build for a phone:
      # every step is skipped and the job ends in seconds. (The Simulator
      # app is CI's to build, on every pull request.)
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING == 'true'
      - name: The newest Xcode (the newest SDKs)
        if: env.HAS_SIGNING == 'true'
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_SIGNING == 'true'
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_SIGNING == 'true'
        with:
          key: ios
          cache-targets: false
      - name: NSH revision
        if: env.HAS_SIGNING == 'true'
        id: nshrev
        run: |
          echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: The target directory
        if: env.HAS_SIGNING == 'true'
        uses: actions/cache@v4
        with:
          path: target
          key: target-ios-device-${{ runner.os }}-${{ steps.nshrev.outputs.month }}-${{ steps.nshrev.outputs.rev }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-ios-device-${{ runner.os }}-${{ steps.nshrev.outputs.month }}-${{ steps.nshrev.outputs.rev }}-
      - name: The nsh CLI cache
        if: env.HAS_SIGNING == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-cli-${{ runner.os }}-${{ steps.nshrev.outputs.rev }}
      - name: The nsh CLI (the commit Cargo.toml pins)
        if: env.HAS_SIGNING == 'true'
        run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
      - name: Version
        if: env.HAS_SIGNING == 'true'
        run: scripts/set-version.sh "${{ inputs.version || github.ref_name }}" "${{ github.run_number }}"
      # Device build and TestFlight: set IOS_CERT_P12 (base64 .p12),
      # IOS_CERT_PASSWORD, IOS_PROFILE (base64 .mobileprovision) and, for
      # the upload, ASC_APP_ID, ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8.
      - name: Signing identity
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "IDENTITY=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Apple Distribution[^"]*\)".*/\1/p' | head -n1)" >> "$GITHUB_ENV"
      # What App Store Connect asks of an upload and `nsh package` leaves out.
      - name: Xcode and SDK in Info.plist
        if: env.HAS_SIGNING == 'true'
        run: scripts/ios-build-info.sh
      - name: Device build
        if: env.HAS_SIGNING == 'true'
        run: nsh package --target ios --icon assets/app-icon/icon-ios-1024.png --sign "$IDENTITY" --profile "$RUNNER_TEMP/app.mobileprovision"
      # altool, not `nsh publish ios`: App Store Connect answers that one's
      # upload with 409, "not a valid value for sourceFileChecksums". An
      # upload that fails is reported and does not hold back the release.
      - name: TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC == 'true'
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc-keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_KEY_P8" > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f .nsh/out/Sophon.ipa --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            || { echo "::error::The iOS build was not uploaded to TestFlight"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: ios
          if-no-files-found: ignore
          path: .nsh/out/*.ipa

  # The Android app: an APK on the GitHub Release, to install directly.
  # Signed with the release key when ANDROID_KEYSTORE (base64 of the
  # keystore), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are set: an
  # update installs over the last only with the same key. Without them it
  # is the debug key, which differs from machine to machine. A failure
  # here does not hold back the Mac and iPhone releases.
  android:
    runs-on: macos-26
    continue-on-error: true
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-targets: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: NSH revision
        id: nshrev
        run: |
          echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: The target directory
        uses: actions/cache@v4
        with:
          path: target
          key: target-android-${{ runner.os }}-${{ steps.nshrev.outputs.month }}-${{ steps.nshrev.outputs.rev }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-android-${{ runner.os }}-${{ steps.nshrev.outputs.month }}-${{ steps.nshrev.outputs.rev }}-
      - name: The nsh CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-cli-${{ runner.os }}-${{ steps.nshrev.outputs.rev }}
      - name: The nsh CLI (the commit Cargo.toml pins)
        run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
      # The build number is the version code: it has to go up with each.
      - name: Version
        run: scripts/set-version.sh "${{ inputs.version || github.ref_name }}" "${{ github.run_number }}"
      - name: Package
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$HAS_KEYSTORE" = true ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            scripts/android-package.sh --keystore "$RUNNER_TEMP/release.jks" --key-alias "$KEY_ALIAS"
          else
            scripts/android-package.sh
          fi
          V=$(scripts/version.sh)
          mv .nsh/out/Sophon.apk ".nsh/out/Sophon-$V-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: .nsh/out/*.apk

  release:
    needs: [macos, ios, android]
    # Android may have failed: the release goes out without its APK.
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.ios.result == 'success' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: NSH revision
        id: nshrev
        run: echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: The nsh CLI cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-cli-${{ runner.os }}-${{ steps.nshrev.outputs.rev }}
      - uses: dtolnay/rust-toolchain@stable
      - name: The nsh CLI (the commit Cargo.toml pins)
        run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
      - name: Update manifest
        run: |
          scripts/set-version.sh "${{ inputs.version || github.ref_name }}"
          cd dist
          git -C .. log -1 --format=%B > NOTES.md
          nsh update-manifest *.tar.gz --entry .. --notes NOTES.md --out .
          rm NOTES.md
          ls -la
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(scripts/version.sh)
          # The tag names the commit that was built, not main as it is by
          # now: a merge that landed during the build is not in this
          # release, and the next one must still see it as new.
          gh release create "v$V" dist/* --title "Sophon $V" --generate-notes --target "${{ github.sha }}" || gh release upload "v$V" dist/* --clobber
      - name: Homebrew cask
        run: |
          V=$(scripts/version.sh)
          scripts/write-cask.sh "$V" \
            "$(shasum -a 256 dist/Sophon-$V-macos-aarch64.tar.gz | cut -d' ' -f1)" > Casks/sophon.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sophon.rb
          git commit -m "Cask: Sophon $V" && git push origin main || echo "cask unchanged"
