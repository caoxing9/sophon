# Builds Sophon for macOS (Apple silicon and Intel) and iOS on a version tag,
# publishes a GitHub Release with the update manifest the app checks
# (`latest.json`), updates the Homebrew cask, and, when the App Store
# secrets are set, uploads the iOS build to TestFlight.
#
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no v)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26   # Apple silicon (Intel Macs are not built)
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode (the newest SDKs)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: NSH revision
        id: nshrev
        run: echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: The nsh CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-${{ runner.os }}-${{ matrix.arch }}-${{ steps.nshrev.outputs.rev }}
      - name: The nsh CLI (the commit Cargo.toml pins)
        run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
      - name: Version
        run: scripts/set-version.sh "${{ inputs.version || github.ref_name }}"
      - name: Package
        run: nsh package --target macos
      - name: Disk image
        run: |
          V=$(scripts/version.sh)
          mkdir -p dmg && cp -R .nsh/out/Sophon.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Sophon -srcfolder dmg -ov -format UDZO ".nsh/out/Sophon-$V-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            .nsh/out/*.tar.gz
            .nsh/out/*.dmg

  ios:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12 != '' && secrets.IOS_PROFILE != '' }}
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode (the newest SDKs)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: NSH revision
        id: nshrev
        run: echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: The nsh CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-${{ runner.os }}-aarch64-${{ steps.nshrev.outputs.rev }}
      - name: The nsh CLI (the commit Cargo.toml pins)
        run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
      - name: Version
        run: scripts/set-version.sh "${{ inputs.version || github.ref_name }}" "${{ github.run_number }}"
      - name: Simulator build
        run: |
          nsh package --target ios-simulator --icon assets/app-icon/icon-ios-1024.png
          cd .nsh/out && zip -qry "Sophon-$(../../scripts/version.sh)-ios-simulator.zip" Sophon.app && rm -rf Sophon.app
      # Device build and TestFlight: set IOS_CERT_P12 (base64 .p12),
      # IOS_CERT_PASSWORD, IOS_PROFILE (base64 .mobileprovision) and, for
      # the upload, ASC_APP_ID, ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8.
      - name: Signing identity
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "IDENTITY=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Apple Distribution[^"]*\)".*/\1/p' | head -n1)" >> "$GITHUB_ENV"
      - name: Device build
        if: env.HAS_SIGNING == 'true'
        run: nsh package --target ios --icon assets/app-icon/icon-ios-1024.png --sign "$IDENTITY" --profile "$RUNNER_TEMP/app.mobileprovision"
      - name: TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC == 'true'
        env:
          NSH_APP_STORE_APP_ID: ${{ secrets.ASC_APP_ID }}
          NSH_APP_STORE_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          NSH_APP_STORE_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          nsh publish ios --private-key "$RUNNER_TEMP/AuthKey.p8" .nsh/out/Sophon.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            .nsh/out/*.zip
            .nsh/out/*.ipa

  release:
    needs: [macos, ios]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: NSH revision
        id: nshrev
        run: echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: The nsh CLI cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-${{ runner.os }}-aarch64-${{ steps.nshrev.outputs.rev }}
      - uses: dtolnay/rust-toolchain@stable
      - name: The nsh CLI (the commit Cargo.toml pins)
        run: echo "$(scripts/install-nsh.sh)" >> "$GITHUB_PATH"
      - name: Update manifest
        run: |
          scripts/set-version.sh "${{ inputs.version || github.ref_name }}"
          cd dist
          git -C .. log -1 --format=%B > NOTES.md
          nsh update-manifest *.tar.gz --entry .. --notes NOTES.md --out .
          rm NOTES.md
          ls -la
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(scripts/version.sh)
          gh release create "v$V" dist/* --title "Sophon $V" --generate-notes || gh release upload "v$V" dist/* --clobber
      - name: Homebrew cask
        run: |
          V=$(scripts/version.sh)
          scripts/write-cask.sh "$V" \
            "$(shasum -a 256 dist/Sophon-$V-macos-aarch64.tar.gz | cut -d' ' -f1)" > Casks/sophon.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sophon.rb
          git commit -m "Cask: Sophon $V" && git push origin main || echo "cask unchanged"
