name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

# One job sets up the nsh CLI (built only when the NSH pin moves, cached
# otherwise); the checks and the UI tests then run side by side, as nothing
# among them waits on another. The relay builds apart. Packaging is the
# release's work, after a merge: here the two package jobs run only when
# the workflow is started by hand, to try a package before merging.
jobs:
  nsh:
    name: nsh CLI
    runs-on: macos-26
    outputs:
      rev: ${{ steps.nsh.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      - name: NSH revision
        id: nsh
        run: echo "rev=$(sed -n 's/^nsh-core = .*rev = \"\([0-9a-f]*\)\".*/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Cache nsh CLI
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-cli-${{ runner.os }}-${{ steps.nsh.outputs.rev }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build nsh
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/install-nsh.sh

  check:
    name: Check and Rust tests
    needs: nsh
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rev: ${{ needs.nsh.outputs.rev }}
          cache-key: check
          targets: aarch64-apple-ios, aarch64-linux-android
      - name: Check
        run: nsh check
      # The phone's build, as far as it shows in a pull request: that it
      # compiles. Packaging it for the Simulator took a job of its own.
      - name: Check for iOS
        run: cargo check --lib --locked --target aarch64-apple-ios
      # And Android's, the same way, with the runner's NDK.
      - name: Check for Android
        run: scripts/android-check.sh
      - name: Rust tests
        run: cargo test --locked

  ui:
    name: UI tests
    needs: nsh
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rev: ${{ needs.nsh.outputs.rev }}
          cache-key: ui
      - name: UI tests (headless)
        run: nsh test App.test.tsx

  macos:
    name: Package macOS
    needs: nsh
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rev: ${{ needs.nsh.outputs.rev }}
          cache-key: macos
          keep-target: true
      - run: nsh package --target macos -o dist/macos
      # With the agent service inside, as a release has it.
      - run: scripts/bundle-service.sh dist/macos/Sophon.app
      - run: ditto -c -k --keepParent dist/macos/Sophon.app dist/Sophon-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sophon-macos
          path: dist/Sophon-macos.zip

  # The Android app for the one ABI phones have (a release builds both).
  android:
    name: Package Android
    needs: nsh
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rev: ${{ needs.nsh.outputs.rev }}
          cache-key: android
          keep-target: true
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      # NSH builds its Android runtime (QuickJS and all, for every ABI) in
      # its own checkout: half an hour from nothing, seconds once it is
      # there. Kept with the checkout, per NSH revision.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sophon-nsh
          key: nsh-android-${{ runner.os }}-${{ needs.nsh.outputs.rev }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: scripts/android-package.sh --abi arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: Sophon-android
          path: .nsh/out/*.apk

  relay:
    name: Relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
      - run: cargo build --release --locked
